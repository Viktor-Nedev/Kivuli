name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Server and pure-math suites (node:test), then the component suite
      # (vitest + jsdom). Kept as two runners on purpose: the server tests need
      # no DOM and no transform.
      - name: Test
        run: npm test

      - name: Test components
        run: npm run test:web

      - name: Build
        run: npm run build
